<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách</title>
</head>
<body>

<h2>Danh sách công việc</h2>

<p th:if="${message}" th:text="${message}" style="color:green"></p>

<a th:href="@{/add}">Thêm mới</a>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Nội dung</th>
        <th>Ngày</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Hành động</th>
    </tr>

    <tr th:each="t : ${todos}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.content}"></td>
        <td th:text="${t.dueDate}"></td>
        <td th:text="${t.status}"></td>
        <td th:text="${t.priority}"></td>
        <td>
            <a th:href="@{/edit/{id}(id=${t.id})}">Sửa</a>
            <a th:href="@{/delete/{id}(id=${t.id})}"
               onclick="return confirm('Bạn chắc chắn muốn xóa?')">Xóa</a>
        </td>
    </tr>

</table>

</body>
</html>
